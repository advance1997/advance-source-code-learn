name: mybatis-first-query
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置本地数据库 root 密码}
      MYSQL_DATABASE: mybatis_learning
      MYSQL_USER: learning
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置本地数据库用户密码}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u learning mybatis_learning -Nse 'SELECT name FROM learning_user WHERE id = 1' | grep -qx advance"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
volumes:
  mysql-data:
